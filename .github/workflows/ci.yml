name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (lint, unit, integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/gateway-node/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration

  java:
    name: ${{ matrix.module }} (unit, integration)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [relay-java, consumer-java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: services/**/pom.xml
      - name: Format check
        working-directory: services
        run: ./mvnw -q -B -pl ${{ matrix.module }} spotless:check
      - name: Verify
        working-directory: services
        run: ./mvnw -B -pl ${{ matrix.module }} verify
      - name: Surefire and failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-reports
          path: |
            services/${{ matrix.module }}/target/surefire-reports
            services/${{ matrix.module }}/target/failsafe-reports

  bench:
    name: Bench (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/python-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m py_compile run.py

  e2e:
    name: End-to-end (Compose + dup30 + invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose file
        run: docker compose config -q
      - name: Build images
        run: docker compose --profile bench build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: dup30 profile with verification
        run: |
          docker compose --profile bench run --rm \
            -v "$PWD/e2e-out:/out" bench \
            --profile dup30 --total 500 --concurrency 50 --report /out/dup30.json
      - name: normal profile with verification
        run: |
          docker compose --profile bench run --rm \
            -v "$PWD/e2e-out:/out" bench \
            --profile normal --total 500 --concurrency 50 --report /out/normal.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e-out/
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
